<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar · Pet Care</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth">
  <div class="card">
    <h1>Pet Care</h1>
    <p class="suave">Vacinas e consultas dos seus bichinhos, em um só lugar.</p>
    <div class="abas">
      <button class="btn-sec" data-aba="login" aria-pressed="true">Entrar</button>
      <button class="btn-sec" data-aba="cadastro" aria-pressed="false">Criar conta</button>
    </div>
    <form id="login">
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro"></p>
      <button class="btn" style="width:100%">Entrar</button>
    </form>
    <form id="cadastro" hidden>
      <label>Nome<input name="nome" required autocomplete="name"></label>
      <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
      <label>Senha (mín. 6 caracteres)<input name="senha" type="password" minlength="6" required autocomplete="new-password"></label>
      <p class="erro"></p>
      <button class="btn" style="width:100%">Criar conta</button>
    </form>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
